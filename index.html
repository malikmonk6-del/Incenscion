⁠<!DOCTYPE html>⁠
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous RPG Simulation</title>
    <style>
        body { background: #0f0f0f; color: #00ff66; font-family: monospace; padding: 20px; margin: 0; }
        #log { height: 65vh; overflow-y: auto; background: #1a1a1a; padding: 15px; border: 1px solid #333; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column-reverse; }
        .event { margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        #stats { background: #222; padding: 10px; border-radius: 5px; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>Incenscion: Autonomous D&D Sim</h1>
    <div id="stats">Hero: <span id="hero-name">Thorin</span> | HP: <span id="hero-hp">100</span> | Gold: <span id="hero-gold">0</span> | Level: <span id="hero-level">1</span></div>
    <br>
    <div id="log"></div>

    <script>
        const hero = { name: "Thorin", hp: 100, maxHp: 100, gold: 0, level: 1, xp: 0 };
        const logDiv = document.getElementById('log');

        const events = [
            (h) => { let g = Math.floor(Math.random()*15)+5; h.gold += g; return `${h.name} explored the dark catacombs and recovered ${g} gold.`; },
            (h) => { let dmg = Math.floor(Math.random()*20)+5; h.hp -= dmg; return `${h.name} was ambushed by shadow goblins! Took ${dmg} damage.`; },
            (h) => { let heal = Math.floor(Math.random()*25)+10; h.hp = Math.min(h.maxHp, h.hp + heal); return `${h.name} found a safe cavern ledge to rest and recovered ${heal} HP.`; },
            (h) => { let xpGain = 30; h.xp += xpGain; if(h.xp >= 100) { h.level++; h.maxHp += 25; h.hp = h.maxHp; h.xp = 0; return `${h.name} defeated an elite boss, gained ${xpGain} XP, and leveled up to Level ${h.level}!`; } return `${h.name} slayed a wandering skeleton and earned ${xpGain} XP.`; }
        ];

        function addLog(text) {
            const div = document.createElement('div');
            div.className = 'event';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logDiv.prepend(div);
        }

        function updateUI() {
            document.getElementById('hero-hp').innerText = hero.hp;
            document.getElementById('hero-gold').innerText = hero.gold;
            document.getElementById('hero-level').innerText = hero.level;
            if (hero.hp <= 0) {
                addLog(`${hero.name} collapsed from wounds... Reviving at camp with full health.`);
                hero.hp = hero.maxHp;
            }
        }

        // Autonomous tick loop runs every 3 seconds
        setInterval(() => {
            const randomEvent = events[Math.floor(Math.random() * events.length)];
            const message = randomEvent(hero);
            addLog(message);
            updateUI();
        }, 3000);

        addLog("Simulation initialized. The autonomous adventure begins...");
    </script>
</body>
</html>
